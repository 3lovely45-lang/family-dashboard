<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>모바일 확인용 (임시)</title>
<style>
  html,body{margin:0;padding:0;background:#556;font-family:sans-serif}
  .wrap{display:flex;gap:14px;padding:10px;align-items:flex-start}
  .col{background:#fff;border-radius:6px;overflow:hidden}
  .col h3{margin:0;padding:4px 8px;font-size:12px;background:#222;color:#fff}
  iframe{border:0;display:block;width:412px}
  #f1{height:4200px}
  #f2{height:1200px}
</style>
</head>
<body>
  <div class="wrap">
    <div class="col"><h3>index.html · 412px</h3><iframe id="f1" src="./index.html" title="index mobile"></iframe></div>
    <div class="col"><h3>world.html · 412px</h3><iframe id="f2" src="./world.html#library" title="world mobile"></iframe></div>
  </div>
</body>
</html>
