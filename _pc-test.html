<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><title>photo card viewport test</title>
<style>html,body{margin:0;padding:0;background:#efe6d6}iframe{border:0;display:block;margin:0 auto;background:#fff}</style>
</head><body>
<iframe id="f" src="index.html"></iframe>
<script>
var q = new URLSearchParams(location.search);
var w = parseInt(q.get('w') || '460', 10), h = parseInt(q.get('h') || '900', 10);
var f = document.getElementById('f');
if (q.get('src')) f.src = q.get('src');
f.style.width = w + 'px'; f.style.height = h + 'px'; f.width = w; f.height = h;
document.title = w + 'x' + h;
</script>
</body></html>
